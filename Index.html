<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Network</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #29292f;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    .stories {
      display: flex;
      gap: 15px;
      padding: 20px;
      overflow-x: auto;
      border-bottom: 1px solid #29292f;
    }

    .story {
      min-width: 70px;
      text-align: center;
    }

    .story-circle {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff0080, #7928ff);
      margin-bottom: 6px;
    }

    .feed {
      padding: 20px;
    }

    .reel {
      background: #15151b;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .reel h2 {
      margin-bottom: 10px;
    }

    .reel-video {
      height: 350px;
      background: #25252d;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      margin-bottom: 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      background: #24242c;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 16px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111116;
      border-top: 1px solid #29292f;
      display: flex;
      justify-content: space-around;
      padding: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Social Network</h1>
  </header>

  <section class="stories">
    <div class="story">
      <div class="story-circle"></div>
      <p>Моя история</p>
    </div>

    <div class="story">
      <div class="story-circle"></div>
      <p>Alex</p>
    </div>

    <div class="story">
      <div class="story-circle"></div>
      <p>Maria</p>
    </div>

    <div class="story">
      <div class="story-circle"></div>
      <p>David</p>
    </div>
  </section>

  <main class="feed">

    <article class="reel">
      <h2>🎬 Reels</h2>

      <div class="reel-video">
        ▶️
      </div>

      <div class="buttons">
        <button>❤️ 0</button>
        <button>💬 0</button>
        <button>↗️ Поделиться</button>
      </div>
    </article>

    <article class="reel">
      <h2>🔥 Рекомендации</h2>

      <div class="reel-video">
        ▶️
      </div>

      <div class="buttons">
        <button>❤️ 0</button>
        <button>💬 0</button>
        <button>↗️ Поделиться</button>
      </div>
    </article>

  </main>

  <nav>
    <span>🏠</span>
    <span>🔎</span>
    <span>➕</span>
    <span>💬</span>
    <span>👤</span>
  </nav>

</body>
</html>
