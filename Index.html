<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Network</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  color: #111;
}

header {
  background: white;
  padding: 18px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid #ddd;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

nav {
  display: flex;
  justify-content: space-around;
  background: white;
  padding: 12px 5px;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  border-top: 1px solid #ddd;
  z-index: 20;
}

nav button {
  background: none;
  border: 0;
  font-size: 13px;
}

main {
  max-width: 600px;
  margin: auto;
  padding-bottom: 80px;
}

.stories {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 15px;
  background: white;
}

.story {
  min-width: 70px;
  text-align: center;
  font-size: 12px;
}

.story-circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg,#7c3aed,#ec4899);
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 24px;
}

.create {
  background: white;
  margin-top: 10px;
  padding: 15px;
}

.create button {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 12px;
  background: #eee;
  font-size: 15px;
}

.post {
  background: white;
  margin-top: 10px;
  padding: 15px;
}

.user {
  font-weight: bold;
  margin-bottom: 12px;
}

.post-image {
  width: 100%;
  height: 260px;
  border-radius: 12px;
  background: linear-gradient(135deg,#6366f1,#ec4899);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 30px;
}

.actions {
  display: flex;
  gap: 20px;
  padding-top: 12px;
}

.actions button {
  border: 0;
  background: none;
  font-size: 18px;
}

.reels {
  background: #111;
  color: white;
  margin-top: 10px;
  padding: 25px 15px;
}

.reel {
  height: 300px;
  margin-top: 15px;
  border-radius: 15px;
  background: linear-gradient(160deg,#111827,#7c3aed);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
}

h2 {
  margin: 0;
}
</style>
</head>

<body>

<header>
  <div class="logo">Social Network</div>
</header>

<main>

<section class="stories">
  <div class="story">
    <div class="story-circle">+</div>
    Ваша история
  </div>

  <div class="story">
    <div class="story-circle">👤</div>
    Alex
  </div>

  <div class="story">
    <div class="story-circle">👩</div>
    Anna
  </div>

  <div class="story">
    <div class="story-circle">😎</div>
    Mike
  </div>
</section>

<section class="create">
  <button onclick="alert('Здесь будет создание публикации')">
    ✏️ Что нового?
  </button>
</section>

<section class="post">
  <div class="user">👤 Alex</div>

  <div class="post-image">
    📷 PHOTO
  </div>

  <div class="actions">
    <button onclick="like(this)">❤️ 0</button>
    <button>💬 0</button>
    <button>↗️</button>
  </div>

  <p>Добро пожаловать в Social Network! 🚀</p>
</section>

<section class="reels">
  <h2>🎬 Reels</h2>

  <div class="reel">
    ▶️ Reel
  </div>

  <div class="reel">
    ▶️ Reel
  </div>
</section>

</main>

<nav>
  <button>🏠<br>Главная</button>
  <button>🔍<br>Поиск</button>
  <button>➕<br>Создать</button>
  <button>🎬<br>Reels</button>
  <button>👤<br>Профиль</button>
</nav>

<script>
function like(button) {
  let number = parseInt(button.innerText.match(/\d+/)[0]);
  number++;
  button.innerText = "❤️ " + number;
}
</script>

</body>
</html>
