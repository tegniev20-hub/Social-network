<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Network</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f7;color:#111}
header{background:white;padding:18px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
.logo{font-size:24px;font-weight:700}
main{max-width:650px;margin:auto;padding-bottom:80px}
.stories{display:flex;gap:14px;overflow-x:auto;background:white;padding:16px}
.story{text-align:center;min-width:70px;font-size:12px}
.circle{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;color:white;font-size:24px;margin:auto auto 5px}
.create,.post{background:white;margin-top:10px;padding:16px}
.create button{width:100%;border:0;border-radius:12px;padding:14px;text-align:left;font-size:15px}
.user{font-weight:bold;margin-bottom:12px}
.photo{height:300px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;color:white;font-size:30px}
.actions{display:flex;gap:22px;padding:12px 0}
.actions button{border:0;background:none;font-size:18px}
.reels{background:#111;color:white;margin-top:10px;padding:18px}
.reel{height:330px;border-radius:15px;margin-top:14px;background:linear-gradient(160deg,#111827,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:38px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px;z-index:10}
nav button{border:0;background:none;font-size:12px}
</style>
</head>
<body>

<header>
<div class="logo">Social Network</div>
</header>

<main>

<section class="stories">
<div class="story"><div class="circle">+</div>Моя история</div>
<div class="story"><div class="circle">👤</div>Alex</div>
<div class="story"><div class="circle">👩</div>Anna</div>
<div class="story"><div class="circle">😎</div>Mike</div>
</section>

<section class="create">
<button>✏️  Что нового?</button>
</section>

<section class="post">
<div class="user">👤 Alex</div>
<div class="photo">📷 PHOTO</div>
<div class="actions">
<button onclick="like(this)">❤️ 0</button>
<button>💬 0</button>
<button>↗️</button>
</div>
<p>Добро пожаловать в Social Network! 🚀</p>
</section>

<section class="reels">
<h2>🎬 Reels</h2>
<div class="reel">▶️ Reel</div>
<div class="reel">▶️ Reel</div>
</section>

</main>

<nav>
<button>🏠<br>Главная</button>
<button>🔍<br>Поиск</button>
<button>➕<br>Создать</button>
<button>🎬<br>Reels</button>
<button>👤<br>Профиль</button>
</nav>

<script>
function like(button){
let n=parseInt(button.innerText.match(/\d+/)[0])+1;
button.innerText="❤️ "+n;
}
</script>

</body>
</html>
