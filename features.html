<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Network — Reels & Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f7;
  color: #111;
}

button,
input {
  font: inherit;
}

.top {
  height: 60px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-size: 21px;
  font-weight: 800;
}

.top button {
  border: 0;
  background: #111;
  color: white;
  padding: 9px 14px;
  border-radius: 10px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding-bottom: 80px;
}

/* MENU */

.menu {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: white;
  border-bottom: 1px solid #ddd;
}

.menu button {
  flex: 1;
  border: 0;
  padding: 11px;
  border-radius: 10px;
  background: #eee;
  font-weight: 700;
}

.menu button.active {
  background: #111;
  color: white;
}

/* REELS */

.reels {
  height: calc(100vh - 125px);
  overflow-y: auto;
  scroll-snap-type: y mandatory;
}

.reel {
  height: calc(100vh - 125px);
  min-height: 500px;
  scroll-snap-align: start;
  position: relative;
  background: #111;
  overflow: hidden;
}

.reel-bg {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 42px;
  font-weight: 900;
  background: linear-gradient(145deg, #111827, #6366f1, #ec4899);
}

.reel:nth-child(2) .reel-bg {
  background: linear-gradient(145deg, #111, #db2777, #7c3aed);
}

.reel:nth-child(3) .reel-bg {
  background: linear-gradient(145deg, #0f172a, #0891b2, #22c55e);
}

.reel-info {
  position: absolute;
  left: 18px;
  right: 80px;
  bottom: 22px;
  color: white;
  background: linear-gradient(transparent, rgba(0,0,0,.8));
  padding-top: 60px;
}

.reel-user {
  font-weight: 800;
  font-size: 17px;
}

.reel-text {
  margin-top: 7px;
  line-height: 1.4;
}

.reel-actions {
  position: absolute;
  right: 12px;
  bottom: 25px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.reel-action {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.55);
  color: white;
  font-size: 20px;
}

.reel-action small {
  display: block;
  font-size: 9px;
  margin-top: 2px;
}

/* CHAT */

.chat {
  height: calc(100vh - 125px);
  background: white;
  display: flex;
  flex-direction: column;
}

.chat-head {
  padding: 15px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #ec4899);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
}

.chat-name {
  font-weight: 800;
}

.online {
  color: #16a34a;
  font-size: 12px;
  margin-top: 3px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.row {
  display: flex;
  margin-bottom: 10px;
}

.row.me {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 17px;
  background: #eee;
  line-height: 1.4;
}

.row.me .bubble {
  background: #635bff;
  color: white;
}

.chat-bottom {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #ddd;
}

.chat-bottom input {
  flex: 1;
  min-width: 0;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 12px;
  outline: none;
}

.chat-bottom button {
  border: 0;
  background: #635bff;
  color: white;
  border-radius: 12px;
  padding: 0 15px;
  font-weight: 700;
}

/* HIDDEN */

.hidden {
  display: none !important;
}

@media (max-width: 600px) {
  .logo {
    font-size: 18px;
  }

  .reels,
  .reel {
    height: calc(100vh - 125px);
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">Social Network</div>

  <button onclick="goHome()">
    Главная
  </button>
</header>


<div class="container">

  <div class="menu">

    <button
      id="reelsButton"
      class="active"
      onclick="showReels()">
      Reels
    </button>

    <button
      id="chatButton"
      onclick="showChat()">
      Чат
    </button>

  </div>


  <!-- REELS -->

  <section id="reels" class="reels">

    <article class="reel">

      <div class="reel-bg">
        REEL 01
      </div>

      <div class="reel-info">
        <div class="reel-user">@alex</div>

        <div class="reel-text">
          Добро пожаловать в Social Network.
        </div>
      </div>

      <div class="reel-actions">

        <button
          class="reel-action"
          onclick="like(this)">
          ♡
          <small>0</small>
        </button>

        <button
          class="reel-action"
          onclick="comment()">
          ○
          <small>Коммент.</small>
        </button>

        <button
          class="reel-action"
          onclick="share()">
          ↗
          <small>Поделиться</small>
        </button>

      </div>

    </article>


    <article class="reel">

      <div class="reel-bg">
        REEL 02
      </div>

      <div class="reel-info">
        <div class="reel-user">@anna</div>

        <div class="reel-text">
          Новые видео каждый день.
        </div>
      </div>

      <div class="reel-actions">

        <button
          class="reel-action"
          onclick="like(this)">
          ♡
          <small>0</small>
        </button>

        <button
          class="reel-action"
          onclick="comment()">
          ○
          <small>Коммент.</small>
        </button>

        <button
          class="reel-action"
          onclick="share()">
          ↗
          <small>Поделиться</small>
        </button>

      </div>

    </article>


    <article class="reel">

      <div class="reel-bg">
        REEL 03
      </div>

      <div class="reel-info">
        <div class="reel-user">@mike</div>

        <div class="reel-text">
          Свайпай вверх, чтобы смотреть дальше.
        </div>
      </div>

      <div class="reel-actions">

        <button
          class="reel-action"
          onclick="like(this)">
          ♡
          <small>0</small>
        </button>

        <button
          class="reel-action"
          onclick="comment()">
          ○
          <small>Коммент.</small>
        </button>

        <button
          class="reel-action"
          onclick="share()">
          ↗
          <small>Поделиться</small>
        </button>

      </div>

    </article>

  </section>


  <!-- CHAT -->

  <section
    id="chat"
    class="chat hidden">

    <div class="chat-head">

      <div class="avatar">
        A
      </div>

      <div>
        <div class="chat-name">
          Alex
        </div>

        <div class="online">
          онлайн
        </div>
      </div>

    </div>


    <div
      id="messages"
      class="messages">

      <div class="row">

        <div class="bubble">
          Привет! 👋
        </div>

      </div>

      <div class="row me">

        <div class="bubble">
          Привет, Alex!
        </div>

      </div>

    </div>


    <div class="chat-bottom">

      <input
        id="messageInput"
        placeholder="Написать сообщение..."
        onkeydown="enterMessage(event)"
      >

      <button onclick="sendMessage()">
        Отправить
      </button>

    </div>

  </section>

</div>


<script>

function showReels() {

  document
    .getElementById("reels")
    .classList.remove("hidden");

  document
    .getElementById("chat")
    .classList.add("hidden");

  document
    .getElementById("reelsButton")
    .classList.add("active");

  document
    .getElementById("chatButton")
    .classList.remove("active");
}


function showChat() {

  document
    .getElementById("reels")
    .classList.add("hidden");

  document
    .getElementById("chat")
    .classList.remove("hidden");

  document
    .getElementById("chatButton")
    .classList.add("active");

  document
    .getElementById("reelsButton")
    .classList.remove("active");
}


function like(button) {

  const number =
    button.querySelector("small");

  let count =
    Number(number.textContent);

  count++;

  number.textContent =
    count;

  button.style.color =
    "#ff3040";
}


function comment() {

  const text =
    prompt("Напиши комментарий:");

  if (text && text.trim()) {

    alert("Комментарий добавлен.");

  }
}


function share() {

  if (navigator.share) {

    navigator.share({
      title: "Social Network",
      text: "Посмотри этот Reel!"
    });

  } else {

    alert("Reel готов к отправке.");

  }
}


function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if (!text) return;


  const row =
    document.createElement("div");

  row.className =
    "row me";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  row.appendChild(bubble);


  document
    .getElementById("messages")
    .appendChild(row);


  input.value = "";


  const messages =
    document.getElementById("messages");

  messages.scrollTop =
    messages.scrollHeight;
}


function enterMessage(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    sendMessage();

  }
}


function goHome() {

  window.location.href =
    "index.html";

}

</script>

</body>
</html>
