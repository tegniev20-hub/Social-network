<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Network — Вход</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#4f46e5 0,transparent 35%),
    radial-gradient(circle at 80% 80%,#ec4899 0,transparent 35%),
    #050505;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.auth-box{
  width:100%;
  max-width:420px;
  padding:30px 24px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:28px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(25px);
  box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:28px;
}

input{
  width:100%;
  padding:16px;
  margin-bottom:13px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:15px;
  outline:none;
  background:rgba(0,0,0,.35);
  color:white;
  font-size:16px;
}

input:focus{
  border-color:#7c3aed;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#635bff,#ec4899);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.switch{
  margin-top:20px;
  text-align:center;
  color:#aaa;
}

.switch span{
  color:#a78bfa;
  font-weight:700;
  cursor:pointer;
}

.message{
  min-height:24px;
  margin-top:16px;
  text-align:center;
  line-height:1.4;
}

.success{
  color:#4ade80;
}

.error{
  color:#fb7185;
}
</style>
</head>

<body>

<div class="auth-box">

  <div class="logo">Social Network</div>

  <div class="subtitle" id="subtitle">
    Войди в свой аккаунт
  </div>

  <input
    id="email"
    type="email"
    placeholder="Email"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="Пароль"
    autocomplete="current-password"
  >

  <button id="mainButton" onclick="handleAuth()">
    Войти
  </button>

  <div class="switch">
    <span id="switchText">Нет аккаунта?</span>
    <span id="switchButton" onclick="toggleMode()">
      Зарегистрироваться
    </span>
  </div>

  <div id="message" class="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://xaxfzzaxfzwanongekyx.supabase.co";

/*
  СЮДА ВСТАВЬ СКОПИРОВАННЫЙ
  PUBLISHABLE KEY
*/
const SUPABASE_KEY =
  "sb_publishable_0NJRFqTuC4zJ3EAjBzWk6g_si1D_2JV";

const { createClient } =
  supabase;

const client =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   MODE
========================= */

let registerMode = false;


/* =========================
   SWITCH LOGIN / REGISTER
========================= */

function toggleMode(){

  registerMode = !registerMode;

  const button =
    document.getElementById("mainButton");

  const subtitle =
    document.getElementById("subtitle");

  const switchText =
    document.getElementById("switchText");

  const switchButton =
    document.getElementById("switchButton");

  clearMessage();

  if(registerMode){

    button.textContent =
      "Зарегистрироваться";

    subtitle.textContent =
      "Создай новый аккаунт";

    switchText.textContent =
      "Уже есть аккаунт?";

    switchButton.textContent =
      "Войти";

  }else{

    button.textContent =
      "Войти";

    subtitle.textContent =
      "Войди в свой аккаунт";

    switchText.textContent =
      "Нет аккаунта?";

    switchButton.textContent =
      "Зарегистрироваться";
  }
}


/* =========================
   AUTH
========================= */

async function handleAuth(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const button =
    document.getElementById("mainButton");

  if(!email || !password){

    showMessage(
      "Заполни email и пароль.",
      "error"
    );

    return;
  }

  if(password.length < 6){

    showMessage(
      "Пароль должен содержать минимум 6 символов.",
      "error"
    );

    return;
  }

  button.disabled = true;

  button.textContent =
    registerMode
      ? "Регистрация..."
      : "Вход...";


  try{

    if(registerMode){

      const { data, error } =
        await client.auth.signUp({
          email: email,
          password: password
        });

      if(error)
        throw error;

      if(data.session){

        showMessage(
          "Регистрация успешна! Открываем сайт...",
          "success"
        );

        setTimeout(() => {
          window.location.href =
            "index.html";
        }, 1000);

      }else{

        showMessage(
          "Аккаунт создан! Проверь почту и подтверди email, затем войди.",
          "success"
        );

        registerMode = false;

        document.getElementById("mainButton")
          .textContent = "Войти";

        document.getElementById("subtitle")
          .textContent = "Войди в свой аккаунт";

        document.getElementById("switchText")
          .textContent = "Нет аккаунта?";

        document.getElementById("switchButton")
          .textContent = "Зарегистрироваться";
      }

    }else{

      const { data, error } =
        await client.auth.signInWithPassword({
          email: email,
          password: password
        });

      if(error)
        throw error;

      showMessage(
        "Вход выполнен! Открываем сайт...",
        "success"
      );

      setTimeout(() => {
        window.location.href =
          "index.html";
      }, 1000);
    }

  }catch(error){

    showMessage(
      error.message || "Произошла ошибка.",
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      registerMode
        ? "Зарегистрироваться"
        : "Войти";
  }
}


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + type;
}


function clearMessage(){

  const message =
    document.getElementById("message");

  message.textContent = "";

  message.className =
    "message";
}

</script>

</body>
</html>
